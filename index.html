<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>工作台 · 工作版块进度</title>
<style>
  :root{
    --bg:#f4f6fb;
    --panel:#ffffff;
    --panel-2:#fafbfe;
    --line:#e6eaf2;
    --line-strong:#d5dbe8;
    --text:#1f2733;
    --muted:#6b7688;
    --muted-2:#98a2b3;
    --brand:#2563eb;
    --brand-weak:#eef3ff;
    --ship:#2563eb;
    --order:#d97706;
    --dev:#7c3aed;
    --other:#64748b;
    --ok:#16a34a;
    --ok-bg:#e9f7ef;
    --warn:#d97706;
    --err:#dc2626;
    --info:#0891b2;
    --gray:#94a3b8;
    --radius:14px;
    --shadow:0 1px 2px rgba(16,24,40,.04), 0 4px 16px rgba(16,24,40,.06);
    --shadow-lg:0 8px 30px rgba(16,24,40,.10);

    /* 浅色专用表面 & 色块（深色主题下会被覆盖） */
    --surface:#ffffff;
    --surface-hover:#f8fafc;
    --solid-bg:#ffffff;
    --cell-todo-bg:#fdecea;
    --cell-todo-fg:#d98a8a;
    --cell-todo-bg-hover:#fbdcda;
    --cell-done-bg:#e9f7ef;
    --cell-done-bg-hover:#dcf0e5;
    --prog-todo-bg:#fdecea;
    --prog-doing-bg:#fff7ed;
    --prog-done-bg:#e9f7ef;
    --track-bg:#e6eaf2;
    --paste:#1f2733;
  }

  /* ===== 深色主题：仅重定义变量，组件无需改动即可适配 ===== */
  html.dark{
    --bg:#0a111f;
    --panel:#131c2e;
    --panel-2:#1a2438;
    --line:#25324a;
    --line-strong:#3a4a68;
    --text:#e5ecf6;
    --muted:#9aa8be;
    --muted-2:#67758f;
    --brand:#60a5fa;
    --brand-weak:#1c3358;
    --ok:#4ade80;
    --ok-bg:#133225;
    --warn:#fbbf24;
    --err:#f87171;
    --info:#22d3ee;
    --gray:#64748b;
    --shadow:0 1px 2px rgba(0,0,0,.32), 0 4px 16px rgba(0,0,0,.38);
    --shadow-lg:0 8px 30px rgba(0,0,0,.55);

    --surface:#131c2e;
    --surface-hover:#1a2438;
    --solid-bg:#0a111f;
    --cell-todo-bg:#3d1c22;
    --cell-todo-fg:#e8908f;
    --cell-todo-bg-hover:#4c232a;
    --cell-done-bg:#133225;
    --cell-done-bg-hover:#19402e;
    --prog-todo-bg:#3d1c22;
    --prog-doing-bg:#3b2a11;
    --prog-done-bg:#133225;
    --track-bg:#1f2b40;
    --paste:#e5ecf6;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--text); font-size:15px; line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }
  a{color:inherit;text-decoration:none;}
  button{font-family:inherit;cursor:pointer;}
  input,select,textarea{font-family:inherit;}

  /* ===== Layout ===== */
  .app{display:flex;min-height:100vh;}
  .sidebar{
    width:224px;flex:0 0 224px;background:var(--panel);border-right:1px solid var(--line);
    position:sticky;top:0;height:100vh;display:flex;flex-direction:column;padding:18px 14px;
  }
  .brand{display:flex;align-items:center;gap:10px;padding:6px 8px 16px;}
  .brand .logo{
    width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,#2563eb,#7c3aed);
    display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:17px;
    box-shadow:0 4px 12px rgba(37,99,235,.35);
  }
  .brand .t1{font-weight:700;font-size:16px;letter-spacing:.2px;}
  .brand .t2{font-size:12px;color:var(--muted-2);}
  .nav{display:flex;flex-direction:column;gap:3px;margin-top:6px;}
  .nav .section-label{font-size:12px;color:var(--muted-2);padding:12px 10px 6px;letter-spacing:.5px;}
  .nav-item{
    display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:10px;color:var(--muted);
    font-weight:500;border:1px solid transparent;transition:.15s;user-select:none;
  }
  .nav-item:hover{background:var(--panel-2);color:var(--text);}
  .nav-item.active{background:var(--brand-weak);color:var(--brand);border-color:#dbe6ff;font-weight:600;}
  .nav-item .ico{width:20px;text-align:center;font-size:16px;}
  .nav-item .pill{
    margin-left:auto;font-size:12px;background:#eef1f6;color:var(--muted);border-radius:20px;
    padding:1px 8px;font-weight:600;
  }
  .nav-item.active .pill{background:var(--surface);color:var(--brand);}
  .sidebar-foot{margin-top:auto;font-size:12px;color:var(--muted-2);padding:10px;line-height:1.7;}

  .main{flex:1;min-width:0;display:flex;flex-direction:column;}
  .topbar{
    position:sticky;top:0;z-index:20;background:rgba(244,246,251,.85);backdrop-filter:blur(8px);
    border-bottom:1px solid var(--line);padding:14px 26px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  }
  .topbar h1{font-size:19px;margin:0;font-weight:700;}
  .topbar .sub{font-size:13px;color:var(--muted-2);margin-top:1px;}
  .topbar .spacer{flex:1;}
  .content{padding:22px 26px 60px;max-width:1840px;width:100%;}
  .view{display:none;}
  .view.active{display:block;animation:fade .22s ease;}
  @keyframes fade{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:none;}}

  /* ===== Buttons ===== */
  .btn{
    display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--text);
    padding:8px 14px;border-radius:10px;font-size:14px;font-weight:600;transition:.15s;white-space:nowrap;
  }
  .btn:hover{background:var(--panel-2);border-color:#c3cbdb;}
  .btn.primary{background:var(--brand);border-color:var(--brand);color:#fff;box-shadow:0 4px 12px rgba(37,99,235,.28);}
  .btn.primary:hover{background:#1d4ed8;border-color:#1d4ed8;}
  .btn.ghost{background:transparent;border-color:transparent;color:var(--muted);}
  .btn.ghost:hover{background:var(--panel-2);color:var(--text);}
  .btn.danger{color:var(--err);border-color:#f3c9c9;background:var(--surface);}
  .btn.danger:hover{background:#fef2f2;}
  .btn.sm{padding:5px 10px;font-size:13px;border-radius:8px;}

  /* ===== Overview ===== */
  .overall{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:22px 24px;display:flex;align-items:center;gap:28px;flex-wrap:wrap;margin-bottom:20px;
  }
  .ring{position:relative;width:112px;height:112px;flex:0 0 112px;}
  .ring svg{transform:rotate(-90deg);}
  .ring .val{
    position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  }
  .ring .val b{font-size:28px;font-weight:800;letter-spacing:-1px;}
  .ring .val span{font-size:12px;color:var(--muted-2);}
  .overall-info{flex:1;min-width:220px;}
  .overall-info h2{margin:0 0 6px;font-size:18px;}
  .overall-info p{margin:0;color:var(--muted);font-size:14px;}
  .overall-stats{display:flex;gap:26px;flex-wrap:wrap;margin-top:14px;}
  .stat{display:flex;flex-direction:column;gap:2px;}
  .stat b{font-size:22px;font-weight:800;}
  .stat span{font-size:13px;color:var(--muted-2);}

  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px;}
  .card{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:18px 18px 16px;display:flex;flex-direction:column;gap:12px;transition:.18s;cursor:pointer;position:relative;overflow:hidden;
  }
  .card:hover{box-shadow:var(--shadow-lg);transform:translateY(-2px);border-color:#dbe3f0;}
  .card .accent{position:absolute;left:0;top:0;bottom:0;width:4px;}
  .card-head{display:flex;align-items:center;gap:12px;}
  .card-head .icon{
    width:42px;height:42px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:22px;
    background:var(--panel-2);
  }
  .card-head .name{font-size:17px;font-weight:700;}
  .card-head .meta{font-size:13px;color:var(--muted-2);}
  .card-head .pct{margin-left:auto;font-size:22px;font-weight:800;}
  .bar{height:8px;border-radius:20px;background:#eef1f6;overflow:hidden;}
  .bar > i{display:block;height:100%;border-radius:20px;transition:width .4s ease;}
  .card-foot{display:flex;align-items:center;justify-content:space-between;font-size:13px;color:var(--muted);}
  .card-note{
    width:100%;border:1px dashed var(--line-strong);background:var(--panel-2);border-radius:9px;padding:8px 10px;
    font-size:13px;color:var(--text);resize:none;min-height:38px;line-height:1.5;
  }
  .card-note:focus{outline:none;border-color:var(--brand);border-style:solid;background:var(--surface);}

  /* ===== Module view ===== */
  .module-head{
    display:flex;align-items:center;gap:16px;flex-wrap:wrap;margin-bottom:16px;
  }
  .module-head .icon{width:48px;height:48px;border-radius:14px;display:flex;align-items:center;justify-content:center;font-size:26px;}
  .module-head .tt{flex:1;min-width:200px;}
  .module-head h2{margin:0;font-size:22px;}
  .module-head .desc{font-size:14px;color:var(--muted-2);}
  .module-progress{display:flex;align-items:center;gap:14px;min-width:260px;}
  .module-progress .bar{flex:1;min-width:130px;}

  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px;}
  .search{
    display:flex;align-items:center;gap:7px;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;padding:7px 12px;min-width:200px;
  }
  .search input{border:none;outline:none;flex:1;font-size:14px;background:transparent;}

  .table-wrap{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    overflow:auto;max-height:calc(100vh - 260px);
  }
  table{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;}
  thead th{
    position:sticky;top:0;z-index:5;background:var(--panel-2);border-bottom:1px solid var(--line-strong);
    font-size:15px;font-weight:700;color:var(--muted);text-align:left;padding:10px 10px;white-space:nowrap;
  }
  tbody td{border-bottom:1px solid var(--line);padding:4px 6px;vertical-align:middle;background:var(--surface);}
  tbody tr:hover td{background:#fafcff;}
  .col-idx{
    position:sticky;left:0;z-index:4;background:var(--panel-2);text-align:center;color:var(--muted-2);font-size:13px;
    font-weight:600;width:44px;min-width:44px;
  }
  tbody tr:hover .col-idx{background:#f1f5fb;}
  .cell-in{
    width:100%;border:1px solid transparent;background:transparent;border-radius:7px;padding:6px 8px;font-size:14px;color:var(--text);
  }
  .cell-in:hover{border-color:var(--line);background:var(--surface);}
  .cell-in:focus{outline:none;border-color:var(--brand);background:var(--surface);box-shadow:0 0 0 3px rgba(37,99,235,.12);}
  textarea.cell-in{resize:vertical;min-height:32px;line-height:1.45;}
  /* 长文本列（备注 / 提样单说明）：完全可编辑 —— 自由换行、拖高、宽度撑满格 */
  textarea.cell-long{min-height:54px;resize:vertical;line-height:1.6;padding:8px 10px;display:block;}
  td.has-long{vertical-align:top;padding-top:6px;}
  select.cell-in{appearance:none;background-image:none;cursor:pointer;}
  .cell-empty{color:var(--muted-2);}
  .row-del{
    border:none;background:transparent;color:var(--muted-2);font-size:16px;padding:4px 7px;border-radius:7px;
  }
  .row-del:hover{background:#fef2f2;color:var(--err);}
  .empty-state{padding:44px 20px;text-align:center;color:var(--muted-2);}
  .empty-state .big{font-size:30px;margin-bottom:8px;}

  .status-badge{
    display:inline-block;padding:3px 10px;border-radius:20px;font-size:13px;font-weight:600;white-space:nowrap;
  }
  .badge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:12px;font-weight:700;white-space:nowrap;}

  /* ===== Daily ===== */
  .daily-add{
    background:linear-gradient(135deg,#eff4ff,#f5f0ff);border:1px solid #dfe6ff;border-radius:var(--radius);
    padding:18px 20px;margin-bottom:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;
  }
  .daily-add .txt{flex:1;min-width:220px;}
  .daily-add h3{margin:0 0 3px;font-size:16px;}
  .daily-add p{margin:0;font-size:14px;color:var(--muted);}
  .timeline{display:flex;flex-direction:column;gap:14px;}
  .day{
    background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
    padding:16px 18px;
  }
  .day-head{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .day-date{font-size:16px;font-weight:700;}
  .day-week{font-size:13px;color:var(--muted-2);background:#f2f5fa;padding:2px 9px;border-radius:20px;}
  .day .del{margin-left:auto;}
  .day-mods{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:10px;}
  .day-mod{border:1px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--panel-2);}
  .day-mod .l{display:flex;align-items:center;justify-content:space-between;font-size:14px;font-weight:600;margin-bottom:6px;}
  .day-mod .note{font-size:13px;color:var(--muted);margin-top:7px;white-space:pre-wrap;}
  .day-summary{margin-top:12px;}
  .day-summary textarea{
    width:100%;border:1px dashed var(--line-strong);border-radius:9px;padding:9px 11px;font-size:14px;
    background:var(--panel-2);resize:vertical;min-height:44px;color:var(--text);
  }
  .day-summary textarea:focus{outline:none;border-style:solid;border-color:var(--brand);background:var(--surface);}

  /* ===== Toast ===== */
  .toast{
    position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(20px);opacity:0;
    background:#111827;color:#fff;padding:11px 20px;border-radius:11px;font-size:14px;font-weight:500;
    box-shadow:var(--shadow-lg);z-index:999;transition:.25s;pointer-events:none;
  }
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  .hint{font-size:13px;color:var(--muted-2);margin:8px 2px 0;}
  .saved-dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--ok);margin-right:5px;}
  .saved-dot.off{background:var(--muted-2);}

  /* ===== Monthly checklist ===== */
  .month-banner{
    display:flex;align-items:center;gap:10px;flex-wrap:wrap;
    background:linear-gradient(135deg,#fdf2f8,#fce7f3);
    border:1px solid #fbcfe8;border-radius:12px;padding:12px 18px;margin-bottom:14px;
    font-size:14px;color:#831843;
  }
  .month-banner b{font-size:17px;color:#9d174d;font-weight:800;}
  .month-banner .spacer{flex:1;}

  .filter-tabs{
    display:inline-flex;gap:2px;background:var(--surface);border:1px solid var(--line-strong);
    border-radius:10px;padding:3px;
  }
  .filter-tab{
    padding:6px 14px;border-radius:7px;font-size:14px;font-weight:600;
    color:var(--muted);cursor:pointer;border:none;background:transparent;
    display:inline-flex;align-items:center;gap:6px;
  }
  .filter-tab:hover{color:var(--text);}
  .filter-tab.active{background:var(--brand);color:#fff;}
  .filter-tab.active.done{background:var(--ok);}
  .filter-tab.active.todo{background:var(--err);}
  .filter-tab .count{
    background:rgba(0,0,0,.08);border-radius:20px;padding:1px 7px;font-size:12px;font-weight:700;
  }
  .filter-tab.active .count{background:rgba(255,255,255,.25);color:#fff;}

  .checklist-grid{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px;
    margin-top:6px;
  }
  .check-item{
    background:var(--surface);border:2px solid var(--err);border-radius:14px;padding:16px 18px;
    display:flex;align-items:center;gap:12px;cursor:pointer;transition:all .15s;
    user-select:none;
  }
  .check-item:hover{transform:translateY(-2px);box-shadow:var(--shadow);}
  .check-item.completed{
    border-color:var(--ok);background:linear-gradient(135deg,#f0fdf4 0%,#dcfce7 100%);
  }
  .check-item input[type="checkbox"]{
    width:24px;height:24px;cursor:pointer;flex:0 0 24px;
    accent-color:var(--ok);
  }
  .check-item .label{
    flex:1;font-size:16px;font-weight:600;color:var(--text);
  }
  .check-item.completed .label{
    text-decoration:line-through;color:var(--muted);
  }
  .check-item .badge{
    font-size:12px;padding:3px 10px;border-radius:20px;font-weight:700;flex:0 0 auto;
  }
  .check-item .badge.uncompleted{background:#fdeaea;color:var(--err);}
  .check-item .badge.completed{background:var(--ok);color:#fff;}
  .checklist-empty{padding:46px 16px;text-align:center;color:var(--muted-2);background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;}
  .monthly-note{
    margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px 16px;
  }
  .monthly-note label{display:block;font-size:13px;font-weight:600;color:var(--muted-2);margin-bottom:6px;}
  .monthly-note textarea{
    width:100%;border:1px dashed var(--line-strong);border-radius:9px;padding:8px 11px;font-size:14px;
    background:var(--panel-2);resize:vertical;min-height:46px;color:var(--text);
  }
  .monthly-note textarea:focus{outline:none;border-style:solid;border-color:#db2777;background:var(--surface);}

  /* 行内勾选模式（发货/订单）：每个客户/单子一张卡片 */
  .add-row-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:14px;}
  .add-row-bar .label{font-size:13px;font-weight:600;color:var(--muted-2);}
  .add-row-bar input{border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:14px;background:var(--panel-2);color:var(--text);min-width:140px;}
  .add-row-bar input:focus{outline:none;border-color:var(--brand);background:var(--surface);}
  .card-row{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 12px 10px;box-shadow:var(--shadow);display:flex;flex-direction:column;}
  .card-row-head{display:flex;gap:10px;align-items:center;flex-wrap:wrap;border-bottom:1px dashed var(--line);padding-bottom:10px;margin-bottom:10px;}
  .card-row-meta{display:flex;gap:8px;align-items:center;flex:1;flex-wrap:wrap;}
  .card-row-meta .field-in{display:flex;align-items:center;gap:5px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;}
  .card-row-meta .field-in:focus-within{border-color:var(--brand);background:var(--surface);}
  .card-row-meta .field-in label{font-size:12px;color:var(--muted-2);font-weight:600;white-space:nowrap;}
  .card-row-meta .field-in input,.card-row-meta .field-in textarea{border:none;outline:none;background:transparent;padding:2px 3px;font-size:14px;color:var(--text);min-width:80px;width:auto;flex:1;}
  .card-row-progress{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:18px;font-size:12px;font-weight:700;background:#fdeaea;color:var(--err);}
  .card-row-progress.doing{background:var(--prog-doing-bg);color:var(--warn);}
  .card-row-progress.done{background:var(--ok-bg);color:var(--ok);}
  .card-row-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:6px;}
  .check-item.compact{padding:7px 10px;border-radius:8px;}
  .check-item.compact .label{font-size:13px;}
  .check-item.compact input[type="checkbox"]{width:16px;height:16px;}
  .check-item.compact .badge{font-size:10px;padding:2px 7px;}
  .card-row .card-note{margin-top:10px;border-top:1px dashed var(--line);padding-top:10px;}
  .card-row .card-note textarea{width:100%;border:1px solid var(--line);border-radius:7px;padding:6px 10px;font-size:14px;background:var(--panel-2);resize:vertical;min-height:36px;color:var(--text);}
  .card-row .card-note textarea:focus{outline:none;border-color:var(--brand);background:var(--surface);}

  /* 单卡内"只看未完成"切换按钮 */
  .card-row-only-todo{background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;font-size:12px;color:var(--muted-2);cursor:pointer;white-space:nowrap;font-weight:600;transition:all .15s;}
  .card-row-only-todo:hover{background:var(--surface);border-color:var(--brand);color:var(--text);}
  .card-row-only-todo.on{background:var(--err);color:#fff;border-color:var(--err);}

  /* ===== 发货/订单 · 横向进度宽表（一行一客户，步骤横向铺开） ===== */
  .matrix-wrap{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);overflow:auto;max-height:calc(100vh - 200px);}
  .matrix{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:14px;}
  .matrix th,.matrix td{white-space:nowrap;border-bottom:1px solid var(--line);}
  .matrix thead th{
    position:sticky;top:0;z-index:3;background:var(--panel-2);
    font-size:14px;font-weight:700;color:var(--muted);letter-spacing:.3px;
    padding:10px 8px;text-align:center;border-bottom:1px solid var(--line-strong);
  }
  .matrix tbody td{height:42px;text-align:center;background:var(--surface);padding:0 8px;}
  .matrix tbody tr:hover td{background:var(--surface-hover);}
  /* 左侧冻结：操作列 + 客户 + 柜号/PI */
  .matrix .c-act{width:46px;min-width:46px;}
  .matrix .c-kh{width:152px;min-width:152px;}
  .matrix .c-gh{width:132px;min-width:132px;}
  .matrix tbody td.c-act{position:sticky;left:0;z-index:2;background:var(--surface);border-right:1px solid var(--line);}
  .matrix tbody td.c-kh{position:sticky;left:46px;z-index:2;background:var(--surface);border-right:1px solid var(--line);}
  .matrix tbody td.c-gh{position:sticky;left:198px;z-index:2;background:var(--surface);border-right:1px solid var(--line-strong);}
  .matrix thead th.c-act{position:sticky;left:0;z-index:6;background:var(--panel-2);border-right:1px solid var(--line);}
  .matrix thead th.c-kh{position:sticky;left:46px;z-index:6;background:var(--panel-2);border-right:1px solid var(--line);text-align:left;}
  .matrix thead th.c-gh{position:sticky;left:198px;z-index:6;background:var(--panel-2);border-right:1px solid var(--line-strong);text-align:left;}
  .matrix tbody tr:hover td.c-act,.matrix tbody tr:hover td.c-kh,.matrix tbody tr:hover td.c-gh{background:var(--surface-hover);}
  /* 冻结列内的可编辑输入 */
  .matrix td.c-kh input,.matrix td.c-gh input{width:100%;border:1px solid transparent;border-radius:7px;padding:6px 8px;font-size:14px;color:var(--text);background:transparent;}
  .matrix td.c-kh input:hover,.matrix td.c-gh input:hover{border-color:var(--line);background:var(--panel-2);}
  .matrix td.c-kh input:focus,.matrix td.c-gh input:focus{outline:none;border-color:var(--brand);background:var(--surface);}
  /* 步骤单元格：红=未完成 绿=已完成，点击可直接勾选 */
  .matrix td.mcell{cursor:pointer;user-select:none;font-size:15px;font-weight:800;color:#c3cbdb;padding:0;}
  .matrix td.mcell:hover{outline:2px solid var(--brand);outline-offset:-2px;}
  .matrix tbody td.mcell.done{background:var(--cell-done-bg);color:var(--ok);}
  .matrix tbody td.mcell.todo{background:var(--cell-todo-bg);color:var(--cell-todo-fg);}
  .matrix tbody tr:hover td.mcell.done{background:var(--cell-done-bg-hover);}
  .matrix tbody tr:hover td.mcell.todo{background:var(--cell-todo-bg-hover);}
  /* 行末总进度徽章 */
  .mprog{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:18px;font-size:12px;font-weight:800;background:var(--prog-todo-bg);color:var(--err);}
  .mprog.doing{background:var(--prog-doing-bg);color:var(--warn);}
  .mprog.done{background:var(--prog-done-bg);color:var(--ok);}
  /* ＋ 展开详情 */
  .mplus{width:26px;height:26px;border-radius:8px;border:1px solid var(--line);background:var(--panel-2);color:var(--muted);font-size:18px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;transition:.15s;}
  .mplus:hover{background:var(--brand);border-color:var(--brand);color:#fff;transform:scale(1.07);}
  .matrix td.c-del{width:46px;}

  /* ===== 详情弹窗 ===== */
  .dlg-mask{position:fixed;inset:0;background:rgba(15,23,42,.42);backdrop-filter:blur(3px);z-index:300;display:none;align-items:center;justify-content:center;padding:24px;}
  .dlg-mask.show{display:flex;}
  .dlg{background:var(--surface);border-radius:16px;box-shadow:0 24px 64px rgba(16,24,40,.28);width:min(760px,100%);max-height:88vh;display:flex;flex-direction:column;overflow:hidden;animation:dlgIn .22s ease;}
  @keyframes dlgIn{from{opacity:0;transform:translateY(12px) scale(.98);}to{opacity:1;transform:none;}}
  .dlg-head{display:flex;align-items:center;gap:12px;padding:15px 20px;border-bottom:1px solid var(--line);background:var(--panel-2);}
  .dlg-head .ttl{font-size:17px;font-weight:800;}
  .dlg-head .sub{font-size:13px;color:var(--muted-2);margin-top:1px;}
  .dlg-head .spacer{flex:1;}
  .dlg-close{width:30px;height:30px;border-radius:9px;border:1px solid var(--line);background:var(--surface);color:var(--muted);font-size:17px;font-weight:700;line-height:1;display:inline-flex;align-items:center;justify-content:center;}
  .dlg-close:hover{background:#fef2f2;border-color:#f3c9c9;color:var(--err);}
  .dlg-body{padding:18px 20px 22px;overflow:auto;}
  .dlg-foot{padding:12px 20px;border-top:1px solid var(--line);background:var(--panel-2);display:flex;gap:10px;justify-content:flex-end;align-items:center;}
  .dlg-sec{margin-bottom:20px;}
  .dlg-sec > h4{margin:0 0 10px;font-size:12px;font-weight:700;color:var(--muted-2);letter-spacing:.5px;}
  .dlg-fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:10px;}
  .dlg-fields .fi{display:flex;flex-direction:column;gap:4px;}
  .dlg-fields .fi label{font-size:12px;font-weight:600;color:var(--muted-2);}
  .dlg-fields .fi input,.dlg-fields .fi textarea{border:1px solid var(--line);border-radius:9px;padding:8px 10px;font-size:14px;color:var(--text);background:var(--panel-2);width:100%;}
  .dlg-fields .fi input:focus,.dlg-fields .fi textarea:focus{outline:none;border-color:var(--brand);background:var(--surface);}
  .dlg-prog{display:flex;align-items:center;gap:12px;margin-bottom:18px;padding:12px 14px;border:1px solid var(--line);border-radius:12px;background:var(--panel-2);}
  .dlg-prog .dbar{flex:1;height:9px;border-radius:20px;background:var(--track-bg);overflow:hidden;}
  .dlg-prog .dbar i{display:block;height:100%;border-radius:20px;transition:width .3s;}
  .dlg-checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(215px,1fr));gap:8px;}
  .dlg-checks .check-item.compact{padding:9px 12px;}
  .dlg-note textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px;color:var(--text);background:var(--panel-2);resize:vertical;min-height:74px;}
  .dlg-note textarea:focus{outline:none;border-color:var(--brand);background:var(--surface);}
  @media (max-width:680px){ .dlg-mask{padding:10px;} .dlg{max-height:94vh;} }

  /* 卡片网格：发货/订单横向多列显示（紧凑：320px 起多列，<680px 才单列） */
  .card-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:12px;align-items:start;}
  @media (max-width:680px){ .card-grid{grid-template-columns:1fr;} }

  /* 表格过滤器（其他 / 开发 用） */
  .table-filter-bar .spacer{flex:1;}
  .table-filter-bar .btn.sm{margin-left:auto;}
  .table-filter-bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-bottom:14px;}
  .table-filter-bar .filter-group{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:3px 8px;}
  .table-filter-bar .filter-group:focus-within{border-color:var(--brand);background:var(--surface);}
  .table-filter-bar .filter-group label{font-size:13px;color:var(--muted-2);font-weight:600;white-space:nowrap;}
  .table-filter-bar .filter-group select,.table-filter-bar .filter-group input{border:none;outline:none;background:transparent;padding:3px 4px;font-size:14px;color:var(--text);min-width:80px;}
  .table-filter-bar .filter-group select{min-width:90px;}
  .table-filter-bar .filter-stat{font-size:13px;color:var(--muted-2);margin-left:auto;padding:3px 10px;background:var(--panel-2);border-radius:18px;font-weight:600;}
  /* 发货/订单：每个进度步骤一个「全部 / 已完成 / 未完成」下拉 */
  .table-filter-bar .fg-sep{width:1px;align-self:stretch;background:var(--line-strong);margin:0 4px;flex:0 0 auto;}
  .table-filter-bar .fg-step{padding:2px 6px;}
  .table-filter-bar .fg-step label{font-size:12px;}
  .table-filter-bar .fg-step select{min-width:70px;font-size:13px;}
  .table-filter-bar .fg-step.active{background:var(--prog-doing-bg);border-color:var(--warn);}
  .table-filter-bar .fg-step.active label,.table-filter-bar .fg-step.active select{color:var(--warn);font-weight:700;}

  /* 主题筛选项（卡片视图/表格视图统一风格 .filter-field） */
  .filter-field{display:flex;align-items:center;gap:6px;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:4px 10px;}
  .filter-field:focus-within{border-color:var(--brand);background:var(--surface);}
  .filter-field label{font-size:13px;color:var(--muted-2);font-weight:600;white-space:nowrap;}
  .filter-field input,.filter-field select{border:none;outline:none;background:transparent;padding:3px 4px;font-size:14px;color:var(--text);min-width:100px;}
  .filter-field select{min-width:90px;}
  /* 进行中 tab 高亮色 */
  .filter-tab.doing{color:#d97706;}
  .filter-tab.doing:hover{color:#b45309;}
  .filter-tab.active.doing{background:#d97706;color:#fff;}
  .filter-tab.paused{color:#6b7280;}
  .filter-tab.paused:hover{color:#374151;}
  .filter-tab.active.paused{background:#6b7280;color:#fff;}

  /* 周工作：仿月工作的清单视图 */
  .weekly-banner{background:linear-gradient(135deg,#0891b2 0%,#06b6d4 100%);color:#fff;padding:11px 16px;border-radius:12px;display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:14px;}
  .weekly-banner b{font-size:16px;margin-right:6px;}
  .weekly-banner .spacer{flex:1;}

  @media (max-width:820px){
    .sidebar{display:none;}
    .content{padding:16px;}
    .topbar{padding:12px 16px;}
  }
  /* 字段级筛选（发货/订单：每项 BOM、订柜、ETD 等都可独立筛选） */
  .field-filter-row{display:flex;flex-wrap:wrap;gap:6px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:12px;}
  .field-filter-row .label{font-size:13px;color:var(--muted-2);font-weight:600;margin-right:4px;white-space:nowrap;}
  .field-filter-row .reset-link{font-size:12px;color:var(--brand);cursor:pointer;margin-left:auto;padding:3px 8px;border-radius:6px;}
  .field-filter-row .reset-link:hover{background:var(--panel-2);}
  .field-pill{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:14px;font-size:13px;font-weight:600;border:1px solid var(--line);background:var(--panel-2);color:var(--text);cursor:pointer;user-select:none;transition:all .15s;}
  .field-pill:hover{border-color:var(--brand);background:var(--surface);}
  .field-pill .pct{opacity:.6;font-size:12px;}
  .field-pill.checked{background:var(--ok-bg);border-color:var(--ok);color:var(--ok);}
  .field-pill.unchecked{background:#fdeaea;border-color:var(--err);color:var(--err);}

  /* ===== 列宽拖拽 ===== */
  /* 注意：thead th 本身是 position:sticky，已天然构成定位上下文，
     这里不能再写 position:relative，否则会顶掉 sticky 表头 */
  .col-resizer{
    position:absolute;top:0;right:0;bottom:0;width:8px;cursor:col-resize;z-index:8;
    user-select:none;touch-action:none;
  }
  .col-resizer::after{
    content:'';position:absolute;top:5px;bottom:5px;left:3px;width:2px;border-radius:2px;
    background:transparent;transition:background .15s;
  }
  .matrix thead th:hover .col-resizer::after{background:var(--line-strong);}
  .col-resizer:hover::after,.col-resizer.on::after{background:var(--brand);width:3px;left:2px;top:3px;bottom:3px;}
  body.resizing{cursor:col-resize!important;user-select:none!important;}
  body.resizing *{cursor:col-resize!important;}

  /* ===== 列头点击筛选（全部 → 已完成 → 未完成） ===== */
  .matrix thead th.c-step{cursor:pointer;user-select:none;transition:background .15s,color .15s;}
  .matrix thead th.c-step:hover{background:var(--brand-weak);color:var(--brand);}
  .matrix thead th.c-step.f-done{background:var(--cell-done-bg);box-shadow:inset 0 -2px 0 var(--ok);}
  .matrix thead th.c-step.f-todo{background:var(--cell-todo-bg);box-shadow:inset 0 -2px 0 var(--err);}
  .col-ttl{display:flex;align-items:center;justify-content:center;gap:4px;font-weight:700;}
  .col-fi{
    width:17px;height:17px;border-radius:6px;font-size:12px;font-weight:800;flex:0 0 auto;
    display:inline-flex;align-items:center;justify-content:center;line-height:1;
  }
  .col-fi.fi-done{background:var(--ok);color:#04240f;}
  .col-fi.fi-todo{background:var(--err);color:#2b0708;}
  .col-cnt{font-weight:600;color:var(--muted-2);font-size:12px;margin-top:1px;}
  .matrix thead th.c-step.f-done .col-cnt{color:var(--ok);}
  .matrix thead th.c-step.f-todo .col-cnt{color:var(--err);}

  /* ===== 主题切换按钮 ===== */
  .theme-btn{display:inline-flex;align-items:center;gap:6px;}
  .theme-btn .ti{font-size:15px;line-height:1;}

  /* ===== 深色：渐变与残余硬编码色 ===== */
  html.dark .check-item.completed{
    background:linear-gradient(135deg,#153a26 0%,#19402e 100%);
  }
  html.dark .check-item.completed .label{color:var(--ok);}
  html.dark .btn.danger{border-color:#5c2626;}
  html.dark .btn.danger:hover{background:#3d1c22;}
  html.dark .dlg-close:hover{background:#3d1c22;border-color:#5c2626;}
  html.dark .field-pill.unchecked{background:var(--cell-todo-bg);}
  html.dark .dlg{box-shadow:0 24px 64px rgba(0,0,0,.7);}
  html.dark .dlg-mask{background:rgba(2,6,16,.62);}
  html.dark .toast{background:var(--text);color:var(--bg);}
  html.dark input:hover,html.dark textarea:hover{border-color:var(--line-strong);}
  html.dark input::placeholder,html.dark textarea::placeholder{color:var(--muted-2);}
  html.dark .matrix-wrap{border-color:var(--line);}
  html.dark .ring circle:first-child{stroke:var(--track-bg);}

  @media print{
    /* 打印始终用浅色，不受深色主题影响 */
    html.dark{
      --bg:#ffffff;--panel:#ffffff;--panel-2:#fafbfe;--line:#e6eaf2;--line-strong:#d5dbe8;
      --text:#1f2733;--muted:#6b7688;--muted-2:#98a2b3;--brand:#2563eb;--brand-weak:#eef3ff;
      --ok:#16a34a;--warn:#d97706;--err:#dc2626;--gray:#94a3b8;
      --surface:#ffffff;--surface-hover:#f8fafc;--solid-bg:#ffffff;
      --cell-todo-bg:#fdecea;--cell-done-bg:#e9f7ef;--track-bg:#e6eaf2;
    }
    .sidebar,.topbar,.toolbar,.daily-add,.row-del,.day .del{display:none!important;}
    body{background:#fff;color:#000;}
    .table-wrap{max-height:none;overflow:visible;box-shadow:none;}
    .matrix-wrap{max-height:none;overflow:visible;}
  }
  /* ===== 多用户登录遮罩 ===== */
  .login-mask{position:fixed;inset:0;z-index:200;display:none;align-items:center;justify-content:center;background:var(--bg);padding:20px;}
  .login-card{background:var(--surface);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);padding:36px 40px;max-width:440px;width:100%;text-align:center;}
  .login-logo{font-size:46px;margin-bottom:6px;}
  .login-card h1{margin:0 0 6px;font-size:22px;font-weight:800;}
  .login-sub{margin:0 0 22px;color:var(--muted);font-size:13px;}
  .login-users{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-bottom:18px;}
  .login-btn{padding:13px 28px;border-radius:12px;border:1px solid var(--line);background:var(--panel-2);color:var(--text);font-size:16px;font-weight:700;cursor:pointer;transition:.15s;}
  .login-btn:hover{border-color:var(--brand);background:var(--surface);color:var(--brand);transform:translateY(-1px);}
  .login-hint{margin:0;color:var(--muted-2);font-size:11px;line-height:1.6;}
  .who{font-size:13px;font-weight:700;color:var(--muted);margin-right:2px;white-space:nowrap;}
</style>
</head>
<body>
<div class="app">
  <aside class="sidebar">
    <div class="brand">
      <div class="logo">台</div>
      <div>
        <div class="t1">工作台</div>
        <div class="t2">工作版块进度</div>
      </div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="sidebar-foot">
      <div><span class="saved-dot" id="saveDot"></span><span id="saveText">已自动保存</span></div>
      <div style="margin-top:6px" id="lastUpdate">—</div>
    </div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div>
        <h1 id="pageTitle">概览</h1>
        <div class="sub" id="pageSub">工作版块整体进度</div>
      </div>
      <div class="spacer"></div>
      <span class="who" id="whoAmI"></span>
      <button class="btn ghost sm" onclick="logout()">切换身份</button>
      <button class="btn theme-btn" id="themeBtn" onclick="toggleTheme()"><span class="ti">🌙</span>深色</button>
      <button class="btn ghost" onclick="printPage()">🖨 打印/PDF</button>
      <button class="btn" onclick="exportCSV()">⬇ 导出CSV</button>
      <button class="btn" onclick="exportJSON()">⬇ 备份(JSON)</button>
      <button class="btn" onclick="document.getElementById('importFile').click()">⬆ 导入备份</button>
      <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
    </header>

    <main class="content">
      <section class="view active" id="view-overview"></section>
      <section class="view" id="view-daily"></section>
      <section class="view" id="view-module"></section>
    </main>
  </div>
</div>
<div class="toast" id="toast"></div>
<div class="login-mask" id="loginMask" style="display:none">
  <div class="login-card">
    <div class="login-logo">🗂️</div>
    <h1>工作模块划分 · 工作台</h1>
    <p class="login-sub">请选择你的身份进入 · 三人数据相互独立</p>
    <div class="login-users" id="loginUsers"></div>
    <p class="login-hint">链接带 ?u=名字 可免密直达，例如 ?u=Maggie</p>
  </div>
</div>
<div class="dlg-mask" id="detailMask" onclick="if(event.target===this)closeDetail()">
  <div class="dlg" id="detailDlg"></div>
</div>

<script>
/* =========================================================
   工作台 · 数据模型（来源：工作版块.pos 思维导图）
   ========================================================= */
const MODULES = [
  {
    id:'ship', name:'发货', icon:'🚢', color:'var(--ship)', hex:'#2563eb', hexDark:'#60a5fa',
    desc:'发货流程：一行一客户 · 12 项步骤横向铺开（订柜→CO），点 ＋ 看详情',
    // 顶部可编辑字段
    headerFields:[
      {k:'kh', label:'客户', type:'text', w:130},
      {k:'gh', label:'柜号', type:'text', w:130}
    ],
    // 勾选字段（按顺序）
    checkFields:[
      {k:'dg',   label:'订柜'},
      {k:'etd',  label:'ETD'},
      {k:'qd',   label:'清单'},
      {k:'k3pk', label:'K3/PK'},
      {k:'pjdd', label:'配件订单'},
      {k:'fpzx', label:'仿牌藏箱·快递'},
      {k:'bgzl', label:'报关资料'},
      {k:'fyw',  label:'发业务·登记报表'},
      {k:'df',   label:'电放'},
      {k:'xb',   label:'信保'},
      {k:'qgzl', label:'清关资料'},
      {k:'co',   label:'CO'}
    ],
    // 备注（长文本）
    noteField:{k:'bz', label:'备注', type:'longtext'},
    // 旧字段顺序保留，兼容老数据
    fields:[

function uid(prefix){ return (prefix||'r') + '_' + Math.random().toString(36).slice(2,9) + Date.now().toString(36).slice(-4); }
function todayStr(d){
  d = d || new Date();
  const p = n => String(n).padStart(2,'0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
function nowTime(){
  const d = new Date(); const p=n=>String(n).padStart(2,'0');
  return p(d.getHours())+':'+p(d.getMinutes());
}
function getCurrentMonth(){
  const d = new Date(); const p=n=>String(n).padStart(2,'0');
  return d.getFullYear()+'-'+p(d.getMonth()+1);
}
function monthLabel(mk){
  if(!/^\d{4}-\d{2}$/.test(mk)) return mk||'';
  const [y,m] = mk.split('-');
  return y + '年 ' + parseInt(m,10) + '月';
}

      const checks = {};

/* 从云端读取某个用户的完整状态；失败则回落到本地默认结构 */
async function apiLoad(user){
  try{
    const r = await fetch('/api/load?u=' + encodeURIComponent(user), { cache:'no-store' });
    if(r.ok){
      const s = await r.json();
      if(s && s.modules){ return migrate(s); }
    }
  }catch(e){ console.warn('云端读取失败，使用本地默认结构', e); }
  return migrate(defaultState());
}

/* 把状态写入云端（对应 data/<user>.json） */
async function apiSave(user, st){
  const r = await fetch('/api/save?u=' + encodeURIComponent(user), {
    method:'POST',
    headers:{'Content-Type':'application/json'},
    body: JSON.stringify(st)
  });
  if(!r.ok) throw new Error('save 失败，状态码 ' + r.status);
  return true;
}

function migrate(s){
  // v2：主题偏好 + 横向宽表列宽记忆
  if(typeof s.version !== 'number' || s.version < 2){
    if(typeof s.theme !== 'string') s.theme = 'light';
    if(!s.matrixColWidths || typeof s.matrixColWidths !== 'object') s.matrixColWidths = {};
    s.version = 2;
  }
  if(s.theme !== 'dark' && s.theme !== 'light') s.theme = 'light';
  if(!s.matrixColWidths || typeof s.matrixColWidths !== 'object') s.matrixColWidths = {};
  // 保证结构完整：新增的版块自动补一份示例数据方便上手；旧数据原样保留
  MODULES.forEach(m=>{
    if(m.id === 'monthly'){
      // 月工作：纯勾选清单结构（checks + monthKey + note），无须数据汇总
      const mm = s.modules.monthly = s.modules.monthly || {};
      if(!mm.checks || typeof mm.checks !== 'object') mm.checks = {};
      m.fields.forEach(f => { if(typeof mm.checks[f.k] !== 'boolean') mm.checks[f.k] = false; });
      if(typeof mm.note !== 'string') mm.note = '';
      if(typeof mm.monthKey !== 'string' || !/^\d{4}-\d{2}$/.test(mm.monthKey)) mm.monthKey = getCurrentMonth();
      delete mm.records;  // 旧版的 records 已不再需要
      return;
    }
    if(m.id === 'weekly'){
      // 周工作：纯勾选清单结构（仿月工作）
      const ww = s.modules.weekly = s.modules.weekly || {};
      if(!ww.checks || typeof ww.checks !== 'object') ww.checks = {};
      m.checkFields.forEach(f => { if(typeof ww.checks[f.k] !== 'boolean') ww.checks[f.k] = false; });
      if(typeof ww.note !== 'string') ww.note = '';
      // 兼容旧 records（把字段归并到 checks / note）
      if(Array.isArray(ww.records)){
        // 把旧 records 的第一个非空字段提取到 note
        const old = ww.records.find(r => r && r.data) || null;
        if(old && old.data){
          m.checkFields.forEach(f => {
            const v = old.data[f.k];
            if(v && String(v).trim()) ww.checks[f.k] = true;
          });
          // 如果旧有 OKR/WEEKLY/SHIPPING PLAN 文本（长内容）保留到 note
          const longTxt = ['okr','weekly','shppln']
            .map(k => old.data[k])
            .filter(v => v && String(v).trim().length > 8)
            .join('\n');
          if(longTxt && !ww.note) ww.note = longTxt;
        }
      }
      delete ww.records;
      if(typeof ww.weekKey !== 'string') ww.weekKey = '';
      return;
    }
    if(!s.modules[m.id]){
      s.modules[m.id] = { records: seedRecords(m), note:'' };
      return;
    }
    if(!Array.isArray(s.modules[m.id].records)) s.modules[m.id].records = [];
    if(typeof s.modules[m.id].note !== 'string') s.modules[m.id].note = '';
    s.modules[m.id].records.forEach(r=>{
      if(!r.id) r.id = uid();
      if(typeof r.updated !== 'string') r.updated = '';
      if(!r.data) r.data = {};
      // 混合模式（发货/订单）：data 放文本字段，checks 放勾选字段
      if(Array.isArray(m.checkFields) && m.checkFields.length){
        if(!r.checks || typeof r.checks !== 'object') r.checks = {};
        m.checkFields.forEach(f => { if(typeof r.checks[f.k] !== 'boolean') r.checks[f.k] = false; });
        // v3：发货「电放·信保」拆分为「电放」+「信保」两个独立步骤
        // 旧数据里勾过 dfxb 的，继承到两个新步骤上（不丢进度，可自行取消）
        if(m.id === 'ship' && r.checks.dfxb !== undefined){
          if(!!r.checks.dfxb){ if(!r.checks.df) r.checks.df = true; if(!r.checks.xb) r.checks.xb = true; }
          delete r.checks.dfxb;
        }
        // 清理已废弃的勾选项（不在当前 checkFields 里的）
        Object.keys(r.checks).forEach(k => {
          if(!m.checkFields.some(f => f.k === k)) delete r.checks[k];
        });
        // 头部字段 + 备注放 data，旧版数据若已存在于 data 自动保留
        const keepKeys = new Set();
        m.headerFields.forEach(f => keepKeys.add(f.k));
        if(m.noteField) keepKeys.add(m.noteField.k);
        // 清理已删除的字段（如发旧的"在手订单"）
        Object.keys(r.data).forEach(k => { if(!keepKeys.has(k)) delete r.data[k]; });
        keepKeys.forEach(k => { if(r.data[k] === undefined) r.data[k] = ''; });
      } else {
        // 纯表格模式（开发/其他）
        // 状态字段：保留 STATUS_LIST 中的合法值；其它映射/默认
        const st = r.status;
        if(!st || STATUS_LIST.indexOf(st)<0) r.status = '进行中';
        m.fields.forEach(f => { if(r.data[f.k] === undefined) r.data[f.k] = ''; });
      }
    });
  });
  if(!Array.isArray(s.daily)) s.daily = [];
  if(typeof s.version !== 'number') s.version = 1;
  return s;
}

/* =========================================================
   进度计算
   ========================================================= */
function moduleProgress(modId){
  if(modId === 'monthly') return monthlyProgress();
  if(modId === 'weekly') return weeklyProgress();
  const m = MODULES.find(x => x.id === modId);
  if(m && Array.isArray(m.checkFields) && m.checkFields.length){
    return mixedProgress(modId);
  }
  const recs = state.modules[modId].records;
  const total = recs.length;
  if(!total) return { pct:0, done:0, total:0, doing:0, problem:0 };
  const done2 = recs.filter(r=>r.status==='已完成').length;
  const doing = recs.filter(r=>r.status==='进行中').length;
  const problem = recs.filter(r=>r.status==='有问题').length;
  // 已完成=100%，进行中=50%，有问题/暂停=0
  let score = 0;
  recs.forEach(r=>{ if(r.status==='已完成') score+=1; else if(r.status==='进行中') score+=0.5; });
  return { pct: Math.round(score/total*100), done:done2, total, doing, problem };
}

// 行内勾选模式（发货/订单）：按勾选完成度算进度
function mixedProgress(modId){
  const m = MODULES.find(x => x.id === modId);
  const recs = state.modules[modId].records || [];
  const total = recs.length;
  if(!total) return { pct:0, done:0, total:0, doing:0, problem:0, todoCount:0, totalChecks:0, doneChecks:0 };
  const checkCount = m.checkFields.length;
  let doneCount = 0, doingCount = 0, todoCount = 0;
  let totalChecks = 0, doneChecks = 0;
  recs.forEach(r => {
    if(!r.checks) r.checks = {};
    let recDone = 0;
    m.checkFields.forEach(f => {
      totalChecks++;
      if(r.checks[f.k]){ doneChecks++; recDone++; }
    });
    if(checkCount && recDone === checkCount) doneCount++;
    else if(recDone > 0) doingCount++;
    else todoCount++;
  });
  const pct = totalChecks ? Math.round(doneChecks/totalChecks*100) : 0;
  return { pct, done:doneCount, total, doing:doingCount, problem:0, todoCount, totalChecks, doneChecks };
}

function monthlyProgress(){
  const m = MODULES.find(x=>x.id==='monthly');
  const checks = (state.modules.monthly && state.modules.monthly.checks) || {};
  const total = m.fields.length;
  let done = 0;
  m.fields.forEach(f => { if(checks[f.k]) done++; });
  const pct = total ? Math.round(done/total*100) : 0;
  return { pct, done, total, doing:0, problem: total-done, todoCount: total-done };
}

// 周工作：纯勾选清单进度
function weeklyProgress(){
  const m = MODULES.find(x=>x.id==='weekly');
  const checks = (state.modules.weekly && state.modules.weekly.checks) || {};
  const total = m.checkFields.length;
  let done = 0;
  m.checkFields.forEach(f => { if(checks[f.k]) done++; });
  const pct = total ? Math.round(done/total*100) : 0;
  return { pct, done, total, doing:0, problem: total-done, todoCount: total-done };
}

  const cur = getCurrentMonth();

    const mdef = MODULES.find(x=>x.id==='monthly');
    m.checks = {};
    mdef.fields.forEach(f => { m.checks[f.k] = false; });
    m.monthKey = cur;
    if(!silent){ toast('🔄 '+monthLabel(cur)+' 已自动重置为未完成'); }
    save();
    return true;
  }
  return false;
}

// 字段级筛选行渲染：每个子项（BOM、订泵、ETD...）一颗 pill，点击循环：全部 → 已勾 → 未勾 → 全部
function renderFieldFilterRow(m, recs, fff){
  if(!m.checkFields || !m.checkFields.length) return '';
  const total = recs.length;
  let pills = '';
  m.checkFields.forEach(f => {
    let checked = 0;
    recs.forEach(r => { if(!r.checks) r.checks = {}; if(r.checks[f.k]) checked++; });
    const unchecked = total - checked;
    const mode = fff[f.k] || 'all';
    const cls = mode === 'checked' ? 'checked' : (mode === 'unchecked' ? 'unchecked' : '');
    const title = mode==='all' ? '点击只显示已勾选'
      : (mode==='checked' ? '当前：只显示已勾选｜点击改为只显示未勾选' : '当前：只显示未勾选｜点击清除筛选');
    pills += '<button class="field-pill '+cls+'" title="'+title+'" '
      + 'onclick="setCheckFieldFilter(\''+m.id+'\',\''+f.k+'\')">'
      + esc(f.label)
      + ' <span class="pct">'+checked+'/'+total+'</span>'
      + (mode==='checked' ? ' <span style="font-size:11px">✓</span>'
        : mode==='unchecked' ? ' <span style="font-size:11px">✗</span>' : '')
      + '</button>';
  });
  const activeCount = Object.keys(fff).filter(k => fff[k] !== 'all').length;
  return '<div class="field-filter-row">'
    + '<span class="label">字段筛选：</span>'
    + pills
    + (activeCount ? '<span class="reset-link" onclick="resetCheckFieldFilter(\''+m.id+'\')">↺ 清空筛选 ('+activeCount+')</span>' : '')
    + '</div>';
}

function moduleThemeFilters(m){

  const fields = [];
  if(Array.isArray(m.headerFields)){
    m.headerFields.forEach(f => { if(f.type === 'text' || !f.type) fields.push(f.k); });
  }
  // 表格模式：所有非特殊字段都可筛
  if(Array.isArray(m.fields)){
    m.fields.forEach(f => { if((f.type === 'text' || !f.type) && fields.indexOf(f.k) < 0) fields.push(f.k); });
  }
  return {

    kh: checkKhFilter[m.id] || (checkFilter && '')

}

function overallProgress(){
  let score = 0, total = 0, done = 0;
  MODULES.forEach(m=>{
    if(m.id === 'monthly'){
      const p = monthlyProgress();
      total += p.total;
      done += p.done;
      score += p.done;
      return;
    }
    if(m.id === 'weekly'){
      const p = weeklyProgress();
      total += p.total;
      done += p.done;
      score += p.done;
      return;
    }
    if(Array.isArray(m.checkFields) && m.checkFields.length){
      const p = mixedProgress(m.id);
      // 每单满分 1，每完成一勾给 1/(记录数×字段数)
      score += p.doneChecks;            // 已完成勾选项数
      total += p.totalChecks;            // 总勾选项数
      done += p.done;                    // 已完成的单子数
      return;
    }
    const recs = state.modules[m.id].records;
    total += recs.length;
    recs.forEach(r=>{ if(r.status==='已完成'){ score+=1; done+=1; } else if(r.status==='进行中'){ score+=0.5; } });
  });
  return { pct: total? Math.round(score/total*100):0, done, total };
}

/* =========================================================
   发货 / 订单 横向宽表：列宽记忆与拖拽调整
   ========================================================= */
function defaultMatrixColWidths(modId){
  const m = MODULES.find(x => x.id === modId);
  const o = { act:46, kh:152, gh:132, prog:96 };
  (m && m.checkFields ? m.checkFields : []).forEach(f => { o[f.k] = Math.max(72, f.w || 100); });
  return o;
}

function getMatrixColWidths(modId){
  if(!state.matrixColWidths || typeof state.matrixColWidths !== 'object') state.matrixColWidths = {};
  if(!state.matrixColWidths[modId] || typeof state.matrixColWidths[modId] !== 'object'){
    state.matrixColWidths[modId] = defaultMatrixColWidths(modId);
  }
  return state.matrixColWidths[modId];
}

// 把列宽写进 thead/tbody 的 width，并重算冻结列的 left 偏移
function applyMatrixWidths(modId){
  const m = MODULES.find(x => x.id === modId);
  if(!m) return;
  const w = getMatrixColWidths(modId);
  const tbl = document.querySelector('.matrix[data-mod="'+modId+'"]');
  if(!tbl) return;

  // 1) 各列宽度（左侧冻结列 + 各步骤列 + 总进度列）
  ['act','kh','gh','prog'].concat(m.checkFields.map(f => f.k)).forEach(k => {
    const px = w[k];
    if(!px) return;
    tbl.querySelectorAll('[data-col="'+k+'"]').forEach(el => {
      el.style.width = px + 'px';
      el.style.minWidth = px + 'px';
    });
  });

  // 2) 冻结列 left 偏移按顺序累加
  const lefts = { act:0, kh:(w.act||46), gh:(w.act||46) + (w.kh||152) };
  ['act','kh','gh'].forEach(k => {
    tbl.querySelectorAll('.c-'+k).forEach(el => { el.style.left = lefts[k] + 'px'; });
  });
}

// 拖拽调整单列宽度：mousedown 起，mouseup 落盘
function startResizeCol(e, modId, colKey){
  e.preventDefault();
  e.stopPropagation();
  const w = getMatrixColWidths(modId);
  const startX = e.clientX;
  const startW = w[colKey] || 100;
  const MIN = 46, MAX = 640;

  try{ document.body.classList.add('resizing'); }catch(err){}
  const handle = e.currentTarget;
  if(handle && handle.classList) handle.classList.add('on');

  let moved = false;
  const onMove = ev => {
    const nw = Math.max(MIN, Math.min(MAX, Math.round(startW + ev.clientX - startX)));
    if(nw !== w[colKey]){ moved = true; w[colKey] = nw; applyMatrixWidths(modId); }
  };
  const onUp = () => {
    document.removeEventListener('mousemove', onMove);
    document.removeEventListener('mouseup', onUp);
    try{ document.body.classList.remove('resizing'); }catch(err){}
    if(handle && handle.classList) handle.classList.remove('on');
    if(moved){ save(); toast('列宽已保存'); }
  };
  document.addEventListener('mousemove', onMove);
  document.addEventListener('mouseup', onUp);
}

// 双击列分隔线：该列恢复默认宽度
function resetColWidth(modId, colKey){
  const w = getMatrixColWidths(modId);
  const d = defaultMatrixColWidths(modId);
  w[colKey] = d[colKey] || 100;
  applyMatrixWidths(modId);
  save();
  toast('该列已恢复默认宽度');
}

// 全部列宽复位
function resetAllColWidths(modId){
  state.matrixColWidths = state.matrixColWidths || {};
  state.matrixColWidths[modId] = defaultMatrixColWidths(modId);
  applyMatrixWidths(modId);
  save();

}

      +   '<span class="label">'+esc(f.label)+'</span>'
      +   '<span class="badge '+(isDone?'completed':'uncompleted')+'">'+(isDone?'已完成':'未完成')+'</span>'
      + '</label>';
    });
  }
  html += '</div>'

  // 周备注
  + '<div class="monthly-note">'
  +   '<label>📝 周备注 / 复盘</label>'
  +   '<textarea placeholder="本周总结、下周计划、注意事项…" '
  +     'oninput="setModuleNote(\'weekly\', this.value)">'+esc(state.modules.weekly.note||'')+'</textarea>'
  + '</div>'

  + '<p class="hint">共 '+total+' 项，显示 '+visible.length+' 项。勾选实时保存，可一键重置本周边界。</p>';

  document.getElementById('view-module').innerHTML = html;
}

function renderCheckModule(m){
  const p = moduleProgress(m.id);
  const recs = state.modules[m.id].records || [];
  const checkCount = m.checkFields.length;
  const filter = checkFilter[m.id] || 'all';
  const khVal = checkKhFilter[m.id] || '';
  const fff = getCheckFieldFilter(m.id);

  // 预先计算过滤后的可见记录（用于工具栏"显示 X / N"统计）
  const visible = [];
  recs.forEach((r) => {
    if(!r.checks) r.checks = {};
    if(!r.data) r.data = {};
    let recDone = 0;
    m.checkFields.forEach(f => { if(r.checks[f.k]) recDone++; });
    const fullyDone = (checkCount && recDone === checkCount);
    // 状态过滤
    if(filter === 'done' && !fullyDone) return;
    if(filter === 'todo' && fullyDone) return;
    if(filter === 'doing' && (recDone === 0 || fullyDone)) return;
    // 客户过滤
    if(khVal){
      const kk = String(r.data.kh||'').toLowerCase();
      if(kk.indexOf(khVal.toLowerCase()) < 0) return;
    }
    // 字段级过滤（AND）
    let fieldBlocked = false;
    for(const fk in fff){
      const mode = fff[fk];
      if(mode === 'all') continue;
      const v = !!r.checks[fk];
      if(mode === 'checked' && !v){ fieldBlocked = true; break; }
      if(mode === 'unchecked' && v){ fieldBlocked = true; break; }
    }
    if(fieldBlocked) return;
    visible.push(r);
  });

  // 模块头部
  let html = ''
  + '<div class="module-head">'
  +   '<div class="icon" style="background:'+modTint(m,.12)+';color:'+modColor(m)+'">'+m.icon+'</div>'
  +   '<div class="tt"><h2>'+m.name+'</h2><div class="desc">'+esc(m.desc)+'</div></div>'
  +   '<div class="module-progress">'
  +     '<div><div style="font-size:24px;font-weight:800;color:'+modColor(m)+'">'+p.pct+'%</div>'
  +       '<div style="font-size:12px;color:var(--muted-2)">已完成 '+p.done+' / '+p.total+' 单 · '+p.doneChecks+'/'+p.totalChecks+' 勾</div></div>'
  +     '<div class="bar"><i style="width:'+p.pct+'%;background:'+modColor(m)+'"></i></div>'
  +   '</div>'
  + '</div>';

  // 添加新客户/单子
  const addId2 = (m.id === 'order') ? 'pi' : 'gh';
  const addLbl2 = (m.id === 'order') ? 'PI' : '柜号';
  const addPh2 = (m.id === 'order') ? 'PI 编号' : '柜号';
  html += '<div class="add-row-bar">'
    +   '<span class="label">＋ 新增'+ m.name + '</span>'
    +   '<input id="add_kh_'+m.id+'" placeholder="客户" autocomplete="off">'
    +   '<input id="add_'+addId2+'_'+m.id+'" placeholder="'+ addPh2 +'" autocomplete="off">'
    +   '<button class="btn primary" onclick="addCheckRow(\''+m.id+'\')">+ 添加</button>'
    + '</div>';

  // 工具栏：table-filter-bar 风格（与开发/其他一致）
  const todoCount = (p.total || 0) - (p.done || 0);
  const doingCount = p.doing || 0;
  html += '<div class="table-filter-bar">'
    // 状态：下拉（与开发同款）
    + '<div class="filter-group"><label>状态</label>'
    +   '<select onchange="setCheckFilter(\''+m.id+'\',this.value)">'
    +     '<option value="all"'+(filter==='all'?' selected':'')+'>全部 ('+(p.total||0)+')</option>'
    +     '<option value="done"'+(filter==='done'?' selected':'')+'>✓ 已完成 ('+(p.done||0)+')</option>'
    +     '<option value="todo"'+(filter==='todo'?' selected':'')+'>✗ 未完成 ('+todoCount+')</option>'
    +     '<option value="doing"'+(filter==='doing'?' selected':'')+'>▶ 进行中 ('+doingCount+')</option>'
    +   '</select>'
    + '</div>'
    // 客户输入
    + '<div class="filter-group"><label>客户</label>'
    +   '<input type="text" placeholder="按客户筛选…" value="'+esc(khVal)+'" '
    +     'oninput="setCheckKhFilter(\''+m.id+'\',this.value)">'
    + '</div>'
    + '<span class="fg-sep"></span>';
  // 每个进度步骤一个下拉：全部 / ✓已完成 / ✗未完成
  // 与列头点击共用同一份状态（fff），任一侧改动另一侧同步
  m.checkFields.forEach(f => {
    let cc = 0;
    recs.forEach(r => { if(r.checks && r.checks[f.k]) cc++; });
    const mode = fff[f.k] || 'all';
    html += '<div class="filter-group fg-step'+(mode!=='all'?' active':'')+'"><label>'+esc(f.label)+'</label>'
      +   '<select onchange="setCheckFieldFilter(\''+m.id+'\',\''+f.k+'\',this.value)" '
      +     'title="'+esc(f.label)+'：筛选已完成 / 未完成">'
      +     '<option value="all"'+(mode==='all'?' selected':'')+'>全部 '+cc+'/'+recs.length+'</option>'
      +     '<option value="checked"'+(mode==='checked'?' selected':'')+'>✓ 已完成 '+cc+'</option>'
      +     '<option value="unchecked"'+(mode==='unchecked'?' selected':'')+'>✗ 未完成 '+(recs.length-cc)+'</option>'
      +   '</select>'
      + '</div>';
  });
  // 清空筛选链接（含列头筛选的清空）
  const activeCols = Object.keys(fff).filter(k => fff[k] && fff[k] !== 'all');
  const filterActive = (filter !== 'all') || khVal || activeCols.length;
  if(filterActive){
    html += '<span class="filter-stat" style="background:var(--prog-doing-bg);color:var(--warn)">'
      + '<a onclick="resetAllCheckFilter(\''+m.id+'\')" style="color:var(--warn);cursor:pointer;text-decoration:underline">↺ 清空筛选'+(activeCols.length?'（'+activeCols.length+' 列）':'')+'</a>'
      + '</span>';
  }
  html += '<span class="filter-stat">显示 '+visible.length+' / '+recs.length+' 条</span>'
    + '<div class="spacer"></div>'
    + '<button class="btn sm" title="把所有列恢复默认宽度" onclick="resetAllColWidths(\''+m.id+'\')">↔ 重置列宽</button>'
    + '</div>';

  // 横向进度宽表：一行一个客户，所有步骤横向铺开
  const secondKey = (m.id === 'order') ? 'pi' : 'gh';
  const hf0 = m.headerFields[0] || {k:'kh', label:'客户'};
  const hf1 = m.headerFields.find(f => f.k === secondKey) || m.headerFields[1] || {k:secondKey, label:secondKey};

  if(!recs.length){
    html += '<div class="checklist-empty" style="padding:46px 16px;text-align:center;color:var(--muted-2);background:var(--surface);border:1px dashed var(--line-strong);border-radius:12px;">📦 还没有'+ m.name +'数据，点上方"添加"按钮录入第一个</div>';
  } else {
    html += '<div class="matrix-wrap"><table class="matrix" data-mod="'+m.id+'">';
    // 拖拽把手（双击 = 该列恢复默认宽度）
    const rz = k => '<span class="col-resizer" data-rz="'+k+'" title="拖动调整列宽，双击复位" '
      + 'onmousedown="startResizeCol(event,\''+m.id+'\',\''+k+'\')" '
      + 'ondblclick="resetColWidth(\''+m.id+'\',\''+k+'\')"></span>';

    // 表头：＋ / 客户 / 柜号|PI / 各步骤 / 总进度 / 删除
    html += '<thead><tr>';
    html += '<th class="c-act" data-col="act">'+rz('act')+'</th>';
    html += '<th class="c-kh" data-col="kh">'+esc(hf0.label)+rz('kh')+'</th>';
    html += '<th class="c-gh" data-col="gh">'+esc(hf1.label)+rz('gh')+'</th>';
    m.checkFields.forEach(f => {
      let cc = 0;
      recs.forEach(r => { if(r.checks && r.checks[f.k]) cc++; });
      const mode = fff[f.k] || 'all';
      const fcls = mode === 'checked' ? ' f-done' : (mode === 'unchecked' ? ' f-todo' : '');
      const badge = mode === 'checked' ? '<span class="col-fi fi-done">✓</span>'
                  : mode === 'unchecked' ? '<span class="col-fi fi-todo">✗</span>' : '';
      const cnt = mode === 'checked' ? (cc + ' 已勾')
                : mode === 'unchecked' ? ((recs.length - cc) + ' 未勾')
                : (cc + '/' + recs.length);
      const tip = esc(f.label) + ' · 点击表头循环筛选（全部 → 已完成 → 未完成）· 拖右边缘调列宽';
      html += '<th class="c-step'+fcls+'" data-col="'+f.k+'" title="'+tip+'" '
        +   'onclick="cycleColFilter(\''+m.id+'\',\''+f.k+'\',event)">'
        +   '<div class="col-ttl">'+badge+esc(f.label)+'</div>'
        +   '<div class="col-cnt">'+cnt+'</div>'
        +   rz(f.k)
        + '</th>';
    });
    html += '<th data-col="prog">总进度'+rz('prog')+'</th>';
    html += '<th class="c-del" data-col="del"></th>';
    html += '</tr></thead><tbody>';

    if(!visible.length){
      const empMsg = (filter==='done' ? '🎉 暂无已完成单据'
        : (filter==='todo' ? '✅ 全部都已完成'
        : (filter==='doing' ? '暂无进行中的单据' : '没有符合当前筛选条件的单据')));
      html += '<tr><td colspan="'+(m.checkFields.length+5)+'" style="padding:46px 16px;text-align:center;color:var(--muted-2)">'+empMsg+'</td></tr>';
    }

    visible.forEach(r => {
      if(!r.checks) r.checks = {};
      if(!r.data) r.data = {};
      let recDone = 0;
      m.checkFields.forEach(f => { if(r.checks[f.k]) recDone++; });
      const progCls = (checkCount && recDone === checkCount) ? 'done' : (recDone > 0 ? 'doing' : 'todo');

      html += '<tr>';
      // ＋ 展开详情
      html += '<td class="c-act" data-col="act"><button class="mplus" title="查看详情" onclick="openDetail(\''+m.id+'\',\''+r.id+'\')">＋</button></td>';
      // 冻结的可编辑头部字段
      html += '<td class="c-kh" data-col="kh"><input type="text" value="'+esc(r.data[hf0.k]||'')+'" placeholder="—" '
        +   'oninput="setCheckField(\''+m.id+'\',\''+r.id+'\',\''+hf0.k+'\',this.value)"></td>';
      html += '<td class="c-gh" data-col="gh"><input type="text" value="'+esc(r.data[hf1.k]||'')+'" placeholder="—" '
        +   'oninput="setCheckField(\''+m.id+'\',\''+r.id+'\',\''+hf1.k+'\',this.value)"></td>';
      // 步骤单元格：绿=已完成，红=未完成，点击切换
      m.checkFields.forEach(f => {
        const checked = !!r.checks[f.k];
        html += '<td class="mcell '+(checked?'done':'todo')+'" data-col="'+f.k+'" '
          +   'title="'+esc(f.label)+' · '+(checked?'已完成':'未完成')+'（点击切换）" '
          +   'onclick="toggleRecordCheck(\''+m.id+'\',\''+r.id+'\',\''+f.k+'\')">'
          +   (checked ? '✓' : '○')
          + '</td>';
      });
      // 行末总进度
      html += '<td data-col="prog"><span class="mprog '+progCls+'">'+recDone+' / '+checkCount+'</span></td>';
      html += '<td class="c-del" data-col="del"><button class="row-del" title="删除该客户" onclick="delRow(\''+m.id+'\',\''+r.id+'\')">✕</button></td>';
      html += '</tr>';
    });

    html += '</tbody></table></div>';
  }

  html += '<p class="hint">共 '+p.total+' 单 · '+p.totalChecks+' 个勾选项，已完成 '+p.doneChecks+' 个。'
    + '<b style="color:var(--err)">红=未完成</b> / <b style="color:var(--ok)">绿=已完成</b>，'
    + '点单元格直接勾选；点行首 <b>＋</b> 打开该单详情页（完整清单 + 进度条 + 备注）。'
    + '<b>点列头</b>按「全部 → 已完成 → 未完成」循环筛选该列；'
    + '<b>拖动列右边缘</b>调整列宽（双击复位），列宽会自动记忆。所有修改实时保存。</p>';
  document.getElementById('view-module').innerHTML = html;
  // innerHTML 写完后立刻套用上次的列宽
  applyMatrixWidths(m.id);
}

function renderModule(m){
  if(m.id === 'monthly') return renderMonthly(m);
  if(m.id === 'weekly') return renderWeekly(m);
  // 行内勾选模式（发货/订单）
  if(Array.isArray(m.checkFields) && m.checkFields.length){
    return renderCheckModule(m);
  }
  // 表格模式（开发 / 其他）：支持多字段过滤
  return renderTableModule(m);
}

// 表格模式（开发 / 其他）：顶部过滤器 + 表格
function renderTableModule(m){
  const p = moduleProgress(m.id);
  const f = tableFilter[m.id] || (tableFilter[m.id] = {status:'all', kh:''});
  // 字段配置：dev 多了 yp/cs/jd 过滤器，other 只有 status+kh
  const isDev = m.id === 'dev';
  if(isDev){
    ['yp','cs','jd','tyd'].forEach(k => { if(typeof f[k] === 'undefined') f[k] = 'all'; });
  }

  const allRows = state.modules[m.id].records || [];
  // 应用过滤
  let visible = allRows.slice();
  if(f.status !== 'all') visible = visible.filter(r => r.status === f.status);
  if(f.kh) visible = visible.filter(r => String(r.data.kh || '').toLowerCase().indexOf(f.kh.toLowerCase()) >= 0);
  if(isDev){
    if(f.yp !== 'all') visible = visible.filter(r => (r.data.yp || '') === f.yp);
    if(f.cs !== 'all') visible = visible.filter(r => (r.data.cs || '') === f.cs);
    if(f.jd !== 'all') visible = visible.filter(r => (r.data.jd || '') === f.jd);
    if(f.tyd !== 'all') visible = visible.filter(r => (r.data.tyd || '') === f.tyd);
  }

  // 模块头
  let html = ''
  + '<div class="module-head">'
  +   '<div class="icon" style="background:'+modTint(m,.12)+';color:'+modColor(m)+'">'+m.icon+'</div>'
  +   '<div class="tt"><h2>'+m.name+'</h2><div class="desc">'+esc(m.desc)+'</div></div>'
  +   '<div class="module-progress">'
  +     '<div><div style="font-size:24px;font-weight:800;color:'+modColor(m)+'">'+p.pct+'%</div>'
  +       '<div style="font-size:12px;color:var(--muted-2)">完成 '+p.done+'/'+p.total+'</div></div>'
  +     '<div class="bar"><i style="width:'+p.pct+'%;background:'+modColor(m)+'"></i></div>'
  +   '</div>'
  + '</div>';

  // 顶部过滤栏（统一风格：状态 tabs + 主题筛选项）
  html += '<div class="toolbar">'
    +   '<div class="filter-tabs">'
    +     '<button class="filter-tab'+(f.status==='all'?' active':'')+'" onclick="setTableFilter(\''+m.id+'\',\'status\',\'all\')">全部 <span class="count">'+allRows.length+'</span></button>'
    +     '<button class="filter-tab doing'+(f.status==='进行中'?' active':'')+'" onclick="setTableFilter(\''+m.id+'\',\'status\',\'进行中\')">▶ 进行中 <span class="count">'+allRows.filter(r=>r.status==='进行中').length+'</span></button>'
    +     '<button class="filter-tab done'+(f.status==='已完成'?' active':'')+'" onclick="setTableFilter(\''+m.id+'\',\'status\',\'已完成\')">✓ 已完成 <span class="count">'+allRows.filter(r=>r.status==='已完成').length+'</span></button>'
    +     '<button class="filter-tab paused'+(f.status==='已暂停'?' active':'')+'" onclick="setTableFilter(\''+m.id+'\',\'status\',\'已暂停\')">⏸ 已暂停 <span class="count">'+allRows.filter(r=>r.status==='已暂停').length+'</span></button>'
    +   '</div>';
  // 主题筛选项（客户）
  const themeFilters2 = moduleThemeFilters(m);
  if(themeFilters2.fields.includes('kh')){
    html += '<div class="filter-field">'
      +   '<label>🔍 客户</label>'
      +   '<input type="text" placeholder="按客户筛选…" value="'+esc(f.kh||'')+'" '
      +     'oninput="setTableFilter(\''+m.id+'\',\'kh\',this.value)">'
      +   '</div>';
  }
  // 开发专属：样品 / 测试 / 进度下拉
  if(isDev){
    html += '<div class="filter-field"><label>样品</label>'
      +   '<select onchange="setTableFilter(\''+m.id+'\',\'yp\',this.value)">'
      +     '<option value="all"'+(f.yp==='all'?' selected':'')+'>全部</option>'
      +     '<option value="YES"'+(f.yp==='YES'?' selected':'')+'>YES</option>'
      +     '<option value="NO"'+(f.yp==='NO'?' selected':'')+'>NO</option>'
      +     '<option value=""'+(f.yp===''?' selected':'')+'>未填</option>'
      +   '</select></div>'
      +   '<div class="filter-field"><label>测试</label>'
      +   '<select onchange="setTableFilter(\''+m.id+'\',\'cs\',this.value)">'
      +     '<option value="all"'+(f.cs==='all'?' selected':'')+'>全部</option>'
      +     '<option value="YES"'+(f.cs==='YES'?' selected':'')+'>YES</option>'
      +     '<option value="NO"'+(f.cs==='NO'?' selected':'')+'>NO</option>'
      +     '<option value=""'+(f.cs===''?' selected':'')+'>未填</option>'
      +   '</select></div>'
      +   '<div class="filter-field"><label>进度</label>'
      +   '<select onchange="setTableFilter(\''+m.id+'\',\'jd\',this.value)">'
      +     '<option value="all"'+(f.jd==='all'?' selected':'')+'>全部</option>'
      +     '<option value="进行中"'+(f.jd==='进行中'?' selected':'')+'>进行中</option>'
      +     '<option value="已完成"'+(f.jd==='已完成'?' selected':'')+'>已完成</option>'
      +   '</select></div>'
      +   '<div class="filter-field"><label>提样单</label>'
      +   '<select onchange="setTableFilter(\''+m.id+'\',\'tyd\',this.value)">'
      +     '<option value="all"'+(f.tyd==='all'?' selected':'')+'>全部</option>'
      +     '<option value="通过"'+(f.tyd==='通过'?' selected':'')+'>通过</option>'
      +     '<option value=""'+(f.tyd===''?' selected':'')+'>未通过 / 未填</option>'
      +   '</select></div>';
  }
  html += '<div class="spacer" style="flex:1"></div>'
    +   '<span class="filter-stat">显示 '+visible.length+' / '+allRows.length+' 条</span>'
    +   '<button class="btn" onclick="exportModuleCSV(\''+m.id+'\')">导出本表CSV</button>'
    +   '<button class="btn danger" onclick="clearModule(\''+m.id+'\')">清空本表</button>'
    + '</div>';

  // 工具栏：增删 + 导出
  html += '<div class="toolbar">'
    +   '<button class="btn primary" onclick="addRow(\''+m.id+'\')">＋ 新增一行</button>'
    +   '<div class="spacer" style="flex:1"></div>'
    +   '<button class="btn" onclick="exportModuleCSV(\''+m.id+'\')">导出本表CSV</button>'
    +   '<button class="btn danger" onclick="clearModule(\''+m.id+'\')">清空本表</button>'
    + '</div>';

  // 表格
  html += '<div class="table-wrap"><table><thead><tr><th class="col-idx">#</th>';
  html += '<th style="min-width:96px">状态</th>';
  m.fields.forEach(f => { html += '<th style="min-width:'+(f.w||110)+'px">'+f.label+'</th>'; });
  html += '<th style="min-width:110px">更新日期</th><th style="min-width:52px"></th></tr></thead><tbody>';

  if(!visible.length){
    html += '<tr><td colspan="'+(m.fields.length+4)+'"><div class="empty-state">'
      + '<div class="big">🔍</div>'
      + '没有匹配的记录，请调整过滤器'
      + '</div></td></tr>';
  } else {
    visible.forEach((r,i)=>{
      html += '<tr>';
      html += '<td class="col-idx">'+(i+1)+'</td>';
      html += '<td>'+statusSelect(m.id, r)+'</td>';
      m.fields.forEach(f2=>{
        html += '<td'+(f2.type==='longtext'?' class="has-long"':'')+' style="min-width:'+(f2.w||110)+'px">'+cellInput(m.id, r, f2)+'</td>';
      });
      html += '<td><input class="cell-in" type="date" value="'+esc(r.updated||'')+'" '
            + 'onchange="setField(\''+m.id+'\',\''+r.id+'\',\'__updated\',this.value)" style="min-width:120px"></td>';
      html += '<td><button class="row-del" title="删除该行" onclick="delRow(\''+m.id+'\',\''+r.id+'\')">✕</button></td>';
      html += '</tr>';
    });
  }
  html += '</tbody></table></div>';
  html += '<p class="hint">共 '+allRows.length+' 条记录，'+visible.length+' 条符合过滤器。修改任意单元格后自动保存。</p>';
  document.getElementById('view-module').innerHTML = html;
}

function statusSelect(modId, r){
  const st = STATUS_STYLE[r.status] || STATUS_STYLE['进行中'];
  let opts = '';
  STATUS_LIST.forEach(s=>{ opts += '<option value="'+s+'"'+(s===r.status?' selected':'')+'>'+s+'</option>'; });
  return '<select class="status-badge" style="border:none;background:'+st.bg+';color:'+st.fg+'" '
    + 'onchange="setStatus(\''+modId+'\',\''+r.id+'\',this.value)">'+opts+'</select>';
}

function cellInput(modId, r, f){
  const val = esc(r.data[f.k]||'');
  const onch = 'onchange="setField(\''+modId+'\',\''+r.id+'\',\''+f.k+'\',this.value)"';
  const onin = 'oninput="setFieldLive(\''+modId+'\',\''+r.id+'\',\''+f.k+'\',this.value)"';
  if(f.type==='select'){
    let o = '';
    f.options.forEach(op=>{ o += '<option value="'+esc(op)+'"'+(op===(r.data[f.k]||'')?' selected':'')+'>'+(op||'—')+'</option>'; });
    return '<select class="cell-in" '+onch+' style="min-width:'+(f.w||110)+'px">'+o+'</select>';
  }
  if(f.type==='date'){
    return '<input class="cell-in" type="date" value="'+val+'" '+onch+' style="min-width:'+(f.w||130)+'px">';
  }
  if(f.type==='longtext'){
    return '<textarea class="cell-in cell-long" '+onin+' rows="2" placeholder="点击填写…" style="min-width:'+(f.w||180)+'px">'+val+'</textarea>';
  }
  return '<input class="cell-in" type="text" value="'+val+'" '+onin+' placeholder="—" style="min-width:'+(f.w||110)+'px">';
}

/* =========================================================
   数据操作

function setField(modId, rid, key, val){
  const r = state.modules[modId].records.find(x=>x.id===rid);
  if(!r) return;
  if(key==='__updated'){ r.updated = val; }
  else { r.data[key] = val; if(!r.updated) r.updated = todayStr(); }
  scheduleSave();
  renderNav();
}
function setFieldLive(modId, rid, key, val){
  const r = state.modules[modId].records.find(x=>x.id===rid);
  if(!r) return;
  r.data[key] = val;
  if(!r.updated) r.updated = todayStr();
  scheduleSave();
}
function setStatus(modId, rid, val){
  const r = state.modules[modId].records.find(x=>x.id===rid);
  if(!r) return;
  r.status = val;
  r.updated = todayStr();
  scheduleSave();
  render();
}
function addRow(modId){
  const m = MODULES.find(x=>x.id===modId);
  const rec = blankRecord(m);
  rec.status = '未开始';
  rec.updated = todayStr();
  state.modules[modId].records.push(rec);
  save();
  render();
  toast('已新增一行');
}

// 行内勾选模式（发货/订单）：添加新客户/单子
function addCheckRow(modId){
  const m = MODULES.find(x=>x.id===modId);
  const kh = (document.getElementById('add_kh_'+modId)||{}).value || '';
  const secondKey = (modId === 'order') ? 'pi' : 'gh';
  const secondVal = (document.getElementById('add_'+secondKey+'_'+modId)||{}).value || '';
  if(!kh.trim()){
    toast('请填写客户');
    const el = document.getElementById('add_kh_'+modId);
    if(el) el.focus();
    return;
  }
  const data = {};
  m.headerFields.forEach(f => { data[f.k] = ''; });
  if(m.noteField) data[m.noteField.k] = '';
  data.kh = kh.trim();
  // 头部第二项
  if(secondKey === 'gh') data.gh = secondVal.trim();
  if(secondKey === 'pi') data.pi = secondVal.trim();
  const checks = {};
  m.checkFields.forEach(f => { checks[f.k] = false; });
  state.modules[modId].records.push({ id: uid(), updated: todayStr(), data, checks });
  save();
  render();
  toast('已添加「'+kh.trim()+'」');
  // 清空输入
  const e1 = document.getElementById('add_kh_'+modId); if(e1) e1.value='';
  const e2 = document.getElementById('add_'+secondKey+'_'+modId); if(e2) e2.value='';
}

// 行内勾选模式：更新头部/备注字段
function setCheckField(modId, rid, key, val){
  const r = state.modules[modId].records.find(x => x.id === rid);
  if(!r) return;
  if(!r.data) r.data = {};
  r.data[key] = val;
  r.updated = todayStr();
  scheduleSave();
  // 只刷新导航，不重渲染整个页面（保持焦点）
  renderNav();
}

// 行内勾选模式：单卡内"只看未完成"切换
function toggleOnlyTodo(modId, rid){
  const r = state.modules[modId].records.find(x => x.id === rid);
  if(!r) return;
  r._onlyTodo = !r._onlyTodo;
  scheduleSave();
  renderModule(MODULES.find(x=>x.id===modId));
}

// 行内勾选模式：切换勾选
function toggleRecordCheck(modId, rid, key){
  const r = state.modules[modId].records.find(x => x.id === rid);
  if(!r) return;
  if(!r.checks) r.checks = {};
  r.checks[key] = !r.checks[key];
  r.updated = todayStr();
  scheduleSave();
  // 重渲染当前模块以更新单元格颜色 & 进度
  renderModule(MODULES.find(x => x.id === modId));
  renderNav();

/* =========================================================
   详情弹窗（发货 / 订单）：点行首 ＋ 打开单张单据的完整详情
   ========================================================= */
let detailState = null;   // {modId, rid}

function openDetail(modId, rid){
  detailState = {modId:modId, rid:rid};
  document.getElementById('detailMask').classList.add('show');
  renderDetail();
}

function closeDetail(){
  detailState = null;
  const mask = document.getElementById('detailMask');
  if(mask) mask.classList.remove('show');
}

function renderDetail(){
  if(!detailState) return;
  const modId = detailState.modId, rid = detailState.rid;
  const m = MODULES.find(x => x.id === modId);
  const recs = (state.modules[modId] && state.modules[modId].records) || [];
  const r = recs.find(x => x.id === rid);
  if(!m || !r){ closeDetail(); return; }
  if(!r.checks) r.checks = {};
  if(!r.data) r.data = {};

  const total = m.checkFields.length;
  let done = 0;
  m.checkFields.forEach(f => { if(r.checks[f.k]) done++; });
  const pct = total ? Math.round(done / total * 100) : 0;
  const progCls = (total && done === total) ? 'done' : (done > 0 ? 'doing' : 'todo');
  const secondKey = (modId === 'order') ? 'pi' : 'gh';
  const hf0 = m.headerFields[0] || {k:'kh', label:'客户'};
  const hf1 = m.headerFields.find(f => f.k === secondKey) || m.headerFields[1] || {k:secondKey, label:secondKey};

  let h = ''
  + '<div class="dlg-head">'
  +   '<div style="width:38px;height:38px;border-radius:11px;display:flex;align-items:center;justify-content:center;'
  +     'font-size:21px;background:'+modTint(m,.12)+';color:'+modColor(m)+'">'+m.icon+'</div>'
  +   '<div><div class="ttl">'+esc(r.data[hf0.k] || '未命名客户')+'</div>'
  +     '<div class="sub">'+m.name+' · 进度详情 · '+esc(hf1.label)+'：'+esc(r.data[hf1.k] || '—')+'</div></div>'
  +   '<div class="spacer"></div>'
  +   '<span class="mprog '+progCls+'">'+done+' / '+total+'</span>'
  +   '<button class="dlg-close" title="关闭" onclick="closeDetail()">✕</button>'
  + '</div>';

  h += '<div class="dlg-body">';

  // 进度条
  h += '<div class="dlg-prog">'
    +   '<div style="font-size:22px;font-weight:800;color:'+modColor(m)+';min-width:50px">'+pct+'%</div>'
    +   '<div class="dbar"><i style="width:'+pct+'%;background:'+modColor(m)+'"></i></div>'
    +   '<div style="font-size:13px;color:var(--muted-2);white-space:nowrap">已完成 '+done+' / '+total+' 项</div>'
    + '</div>';

  // 基本信息
  h += '<div class="dlg-sec"><h4>基本信息</h4><div class="dlg-fields">';
  [hf0, hf1].forEach(f => {
    h += '<div class="fi"><label>'+esc(f.label)+'</label>'
      +   '<input type="text" value="'+esc(r.data[f.k]||'')+'" placeholder="—" '
      +     'oninput="setCheckField(\''+modId+'\',\''+rid+'\',\''+f.k+'\',this.value)">'
      + '</div>';
  });
  h += '</div></div>';

  // 完整勾选清单
  h += '<div class="dlg-sec"><h4>进度勾选（点击任意项切换）</h4><div class="dlg-checks">';
  m.checkFields.forEach((f, i) => {
    const checked = !!r.checks[f.k];
    h += '<label class="check-item compact'+(checked?' completed':'')+'">'
      +   '<input type="checkbox" '+(checked?'checked':'')+' '
      +     'onchange="toggleRecordCheck(\''+modId+'\',\''+rid+'\',\''+f.k+'\')">'
      +   '<span class="label">'+(i+1)+'. '+esc(f.label)+'</span>'
      + '</label>';
  });
  h += '</div></div>';

  // 备注
  if(m.noteField){
    h += '<div class="dlg-sec dlg-note"><h4>'+esc(m.noteField.label)+'</h4>'
      +   '<textarea placeholder="'+esc(m.noteField.label)+'…" '
      +     'oninput="setCheckField(\''+modId+'\',\''+rid+'\',\''+m.noteField.k+'\',this.value)">'
      +     esc(r.data[m.noteField.k]||'')+'</textarea></div>';
  }

  h += '</div>';

  h += '<div class="dlg-foot">'
    +   '<span style="font-size:12px;color:var(--muted-2);margin-right:auto">最后编辑：'+esc(r.updated || '—')+'</span>'
    +   '<button class="btn danger sm" onclick="modalDelRow(\''+modId+'\',\''+rid+'\')">删除本单</button>'
    +   '<button class="btn primary" onclick="closeDetail()">完成</button>'
    + '</div>';

  document.getElementById('detailDlg').innerHTML = h;
}

// 详情弹窗内删除：先确认再删，删完自动关闭弹窗
function modalDelRow(modId, rid){
  const m = MODULES.find(x => x.id === modId);
  const recs = (state.modules[modId] && state.modules[modId].records) || [];
  const idx = recs.findIndex(x => x.id === rid);
  if(idx < 0){ closeDetail(); return; }
  const name = recs[idx].data.kh || '这一单';
  if(!confirm('确定删除「'+name+'」？此操作不可撤销。')) return;
  recs.splice(idx, 1);
  save();
  render();
  closeDetail();
  toast('已删除「'+name+'」');
}
function delRow(modId, rid){
  const recs = state.modules[modId].records;
  const idx = recs.findIndex(x=>x.id===rid);
  if(idx<0) return;
  if(!confirm('确定删除这一行吗？此操作不可撤销。')) return;
  recs.splice(idx,1);
  save();
  render();
}
function clearModule(modId){
  const m = MODULES.find(x=>x.id===modId);
  if(!confirm('确定清空「'+m.name+'」版块的全部数据吗？此操作不可撤销。')) return;
  if(modId === 'monthly'){
    state.modules.monthly.checks = {};
    m.fields.forEach(f => { state.modules.monthly.checks[f.k] = false; });
    state.modules.monthly.note = '';
  } else if(modId === 'weekly'){
    state.modules.weekly.checks = {};
    m.checkFields.forEach(f => { state.modules.weekly.checks[f.k] = false; });
    state.modules.weekly.note = '';
  } else {
    state.modules[modId].records = [];
  }
  save();
  render();
  toast('已清空「'+m.name+'」');
}
function onSearch(modId, val){
  searchTerm[modId] = val;
  renderModule(MODULES.find(x=>x.id===modId));
}

  let html = ''
  + '<div class="daily-add">'
  +   '<div class="txt"><h3>记录今日进度</h3>'

  +   '<button class="btn primary" onclick="recordToday()">📸 记录今天（'+todayStr()+'）</button>'
