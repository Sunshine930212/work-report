  if(!state.daily.length){
    html += '<div class="table-wrap"><div class="empty-state"><div class="big">🗓️</div>还没有每日记录，点击上方按钮记录今天</div></div>';
  } else {
    html += '<div class="timeline">';
    state.daily.forEach(d=>{
      html += ''
      + '<div class="day">'
      +   '<div class="day-head">'
      +     '<span class="day-date">'+d.date+'</span>'
      +     '<span class="day-week">'+weekday(d.date)+'</span>'
      +     '<span style="font-size:13px;color:var(--muted-2)">记录于 '+esc(d.time||'')+'</span>'
      +     '<button class="btn danger sm del" onclick="delDay(\''+d.id+'\')">删除</button>'
      +   '</div>'
      +   '<div class="day-mods">';
      d.items.forEach(it=>{
        const m = MODULES.find(x=>x.id===it.modId) || {icon:'•',name:it.name,hex:'#64748b'};
        html += '<div class="day-mod">'
          + '<div class="l"><span>'+m.icon+' '+esc(it.name)+'</span>'
          +   '<span style="color:'+modColor(m)+'">'+it.pct+'%</span></div>'
          + '<div class="bar"><i style="width:'+it.pct+'%;background:'+modColor(m)+'"></i></div>'
          + (it.note? '<div class="note">💡 '+esc(it.note)+'</div>':'')
          + '</div>';
      });
      html += '</div>'
        + '<div class="day-summary"><textarea placeholder="今日总结 / 明日计划…" '
        + 'oninput="setDaySummary(\''+d.id+'\', this.value)">'+esc(d.summary||'')+'</textarea></div>'
        + '</div>';
    });
    html += '</div>';
  }
  document.getElementById('view-daily').innerHTML = html;
}

function weekday(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  if(isNaN(d)) return '';
  return '周' + '日一二三四五六'[d.getDay()];
}

function recordToday(){
  const date = todayStr();
  const items = MODULES.map(m=>{
    const p = moduleProgress(m.id);
    return { modId:m.id, name:m.name, pct:p.pct, note:state.modules[m.id].note || '' };
  });
  // 同一天重复记录 → 覆盖
  const exist = state.daily.find(d=>d.date===date);
  if(exist){
    if(!confirm('今天已有一条记录，是否覆盖为最新进度？')) return;
    exist.items = items; exist.time = nowTime();
  } else {
    state.daily.unshift({ id: uid('d'), date, time: nowTime(), items, summary:'' });
  }
  save();
  render();
  toast('已记录 '+date+' 的进度');
}
function delDay(id){
  if(!confirm('删除这条每日记录？')) return;
  state.daily = state.daily.filter(d=>d.id!==id);
  save(); render();
}
function setDaySummary(id, val){
  const d = state.daily.find(x=>x.id===id);
  if(d){ d.summary = val; scheduleSave(); }
}

/* =========================================================
   保存节流
   ========================================================= */
function scheduleSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 500);
}

/* =========================================================
   导入 / 导出
   ========================================================= */
function download(filename, text, mime){
  const blob = new Blob([text], {type: mime || 'text/plain;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 2000);
}

function exportJSON(){
  download('工作台备份_'+todayStr()+'.json', JSON.stringify(state,null,2), 'application/json');
  toast('已导出备份文件');
}

function importJSON(ev){
  const file = ev.target.files && ev.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = function(){
    try{
      const obj = JSON.parse(reader.result);
      if(!obj || !obj.modules) throw new Error('文件格式不正确');
      if(!confirm('导入将覆盖当前所有数据，确定继续吗？')) return;
      state = migrate(obj);
      save(); render();
      toast('导入成功');
    }catch(e){
      alert('导入失败：' + e.message);
    }
  };
  reader.readAsText(file,'utf-8');
  ev.target.value = '';
}

function csvCell(v){
  v = String(v==null?'':v);
  if(/[",\n\r]/.test(v)) return '"'+v.replace(/"/g,'""')+'"';
  return v;
}
function exportModuleCSV(modId){
  const m = MODULES.find(x=>x.id===modId);
  if(modId === 'monthly'){
    const mm = state.modules.monthly;
    const checks = mm.checks || {};
    const lines = [['月份','项目','状态'].map(csvCell).join(',')];
    m.fields.forEach(f=>{
      lines.push([mm.monthKey||'', f.label, checks[f.k]?'已完成':'未完成'].map(csvCell).join(','));
    });
    download('工作台_'+m.name+'_'+(mm.monthKey||todayStr())+'.csv', '\ufeff'+lines.join('\r\n'), 'text/csv;charset=utf-8');
    toast('已导出「'+m.name+'」');
    return;
  }
  if(modId === 'weekly'){
    const ww = state.modules.weekly;
    const checks = ww.checks || {};
    const lines = [['项目','状态'].map(csvCell).join(',')];
    m.checkFields.forEach(f=>{
      lines.push([f.label, checks[f.k]?'已完成':'未完成'].map(csvCell).join(','));
    });
    download('工作台_'+m.name+'_'+todayStr()+'.csv', '\ufeff'+lines.join('\r\n'), 'text/csv;charset=utf-8');
    toast('已导出「'+m.name+'」');
    return;
  }
  // 行内勾选模式（发货/订单）：每行 = 头部字段 + 每个勾选字段（✓/✗）+ 备注 + 进度
  if(Array.isArray(m.checkFields) && m.checkFields.length){
    const recs = state.modules[modId].records;
    const head = ['序号'].concat(m.headerFields.map(f=>f.label))
      .concat(m.checkFields.map(f=>f.label))
      .concat(['已完成数','进度%'])
      .concat(m.noteField ? [m.noteField.label] : []);
    const lines = [head.map(csvCell).join(',')];
    recs.forEach((r,i)=>{
      if(!r.checks) r.checks = {};
      let recDone = 0;
      m.checkFields.forEach(f => { if(r.checks[f.k]) recDone++; });
      const pct = m.checkFields.length ? Math.round(recDone/m.checkFields.length*100) : 0;
      const row = [i+1]
        .concat(m.headerFields.map(f => r.data[f.k]||''))
        .concat(m.checkFields.map(f => r.checks[f.k]?'✓':'✗'))
        .concat([recDone+'/'+m.checkFields.length, pct])
        .concat(m.noteField ? [r.data[m.noteField.k]||''] : []);
      lines.push(row.map(csvCell).join(','));
    });
    download('工作台_'+m.name+'_'+todayStr()+'.csv', '\ufeff'+lines.join('\r\n'), 'text/csv;charset=utf-8');
    toast('已导出「'+m.name+'」');
    return;
  }
  const rows = state.modules[modId].records;
  const head = ['序号','状态','更新日期'].concat(m.fields.map(f=>f.label)).concat(['今日重点(版块)']);
  const lines = [head.map(csvCell).join(',')];
  rows.forEach((r,i)=>{
    const line = [i+1, r.status, r.updated||'']
      .concat(m.fields.map(f=>r.data[f.k]||''))
      .concat([i===0 ? (state.modules[modId].note||'') : '']);
    lines.push(line.map(csvCell).join(','));
  });
  download('工作台_'+m.name+'_'+todayStr()+'.csv', '\ufeff'+lines.join('\r\n'), 'text/csv;charset=utf-8');
  toast('已导出「'+m.name+'」');
}

      lines.push(head.map(csvCell).join(','));
      state.modules[m.id].records.forEach((r,i)=>{
        lines.push([i+1, r.status, r.updated||''].concat(m.fields.map(f=>r.data[f.k]||'')).map(csvCell).join(','));
      });
    }
    lines.push('');
  });
  lines.push('【每日进度】');
  lines.push(['日期','时间','版块','进度%','重点'].map(csvCell).join(','));
  state.daily.forEach(d=>{
    d.items.forEach(it=>{
      lines.push([d.date, d.time||'', it.name, it.pct, it.note||''].map(csvCell).join(','));
    });
  });
  download('工作台_全部_'+todayStr()+'.csv', '\ufeff'+lines.join('\r\n'), 'text/csv;charset=utf-8');
  toast('已导出全部数据');
}

function printPage(){ window.print(); }

/* =========================================================
   工具
   ========================================================= */
function esc(s){
  return String(s==null?'':s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
}

/* =========================================================
   登录 / 云端同步（三人免密，数据各自独立）
   ========================================================= */
function getQueryUser(){
  try{
    const p = new URLSearchParams(location.search);
    return (p.get('u') || '').trim();
  }catch(e){ return ''; }
}

function renderLoginButtons(){
  const box = document.getElementById('loginUsers');
  if(box) box.innerHTML = USERS.map(n =>
    `<button class="login-btn" onclick="enterUser('${n}')">${esc(n)}</button>`
  ).join('');
}

function showLogin(){
  currentUser = null;
  state = null;
  const who = document.getElementById('whoAmI');
  if(who) who.textContent = '';
  renderLoginButtons();
  const mask = document.getElementById('loginMask');
  if(mask) mask.style.display = 'flex';
}

async function enterUser(name){
  if(USERS.indexOf(name) < 0) return;
  currentUser = name;
  const mask = document.getElementById('loginMask');
  if(mask) mask.style.display = 'none';
  // 身份写进地址栏，手机端可直接复制免密链接分享
  try{
    const url = new URL(location.href);
    url.searchParams.set('u', name);
    history.replaceState(null, '', url.toString());
  }catch(e){}
  const who = document.getElementById('whoAmI');
  if(who) who.textContent = '当前身份：' + name;
  state = await apiLoad(name);
  render();
}

function logout(){
  currentUser = null;
  state = null;
  try{
    const url = new URL(location.href);
    url.searchParams.delete('u');
    history.replaceState(null, '', url.toString());
  }catch(e){}
  showLogin();
}

async function bootstrap(){
  applyTheme();
  const u = getQueryUser();
  if(u && USERS.indexOf(u) >= 0){
    await enterUser(u);
  } else {
    showLogin();
  }
}

/* =========================================================
   启动
   ========================================================= */
bootstrap();
</script>
